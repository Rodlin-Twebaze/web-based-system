<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Complaints</title>
    <link rel="stylesheet" href="Design2.css">
    <script src="js/common.js" defer></script>
    <script src="js/admin-shared.js" defer></script>
    <script defer>
        document.addEventListener("DOMContentLoaded", () => initStatusPage("open"));
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="bar">
        <a href="admin-dashboard.html">Admin Dashboard</a>
        <a href="opening.html" class="active">Open</a>
        <a href="pending.html">Pending</a>
        <a href="closed.html">Closed</a>
        <a href="logout.html">Logout</a>
    </div>

    <div class="panel">
        <h1>Open Complaints</h1>
        <p>Complaints that are currently open and awaiting action.</p>
        <p id="emptyState" class="empty-state" hidden>There are no open complaints.</p>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Submitted By</th>
                    <th>Type</th>
                    <th>Message</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="complaintsBody"></tbody>
        </table>
    </div>

    <footer>
        <p>&copy; 2026 Ministry of Local Government</p>
    </footer>
</body>
</html>
