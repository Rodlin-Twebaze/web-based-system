<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="Design2.css">
    <script src="web.js" defer></script>
</head>
<body>
    <div class="navbar">
        <a href="home.html">Home</a>
        <a href="submit-complaint.html">Submit Complaint</a>
    </div>

    <h1>Submit Complaint</h1>
    <form action="submit-complaint.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        
        <label for="complaint">Complaint:</label><br>
       
        
        <textarea id="complaint" name="complaint" rows="4" cols="50" required></textarea><br><br>
        <form id="complaintForm" action="complaint-success.html" method="post">
    
        <input type="submit" value="Submit Complaint">
    </form>
        
    <select id="complaintCategory" name="complaintCategory" required>
        <option value="">Select a category</option>
        <option value="water">Water Supply</option>
        <option value="electricity">Electricity</option>
        <option value="road">Road Issue</option>
        <option value="waste">Waste Management</option>
        <option value="security">Security</option>
        </select>
        
        
        <input type="submit" value="Submit">
    <footer style="background-color: #333; color: white; padding: 20px; text-align: center; margin-top: 20px;">
        
        <p>&copy; 2026 Ministry of Local Government</p>
    </footer>

</body>
</html>
