<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints</title>
    <link rel="stylesheet" href="Design2.css">
    <script src="js/common.js" defer></script>
    <script src="js/user-dashboard.js" defer></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="home.html">Home</a>
        <a href="user-dashboard.html" class="active">My Complaints</a>
        <a href="submit-complaint.html">Submit Complaint</a>
        <a href="logout.html">Logout</a>
    </div>

    <div class="panel">
        <h1>Welcome, <span id="welcomeName"></span></h1>
        <p>Track the status of every complaint you have submitted.</p>
        <a href="submit-complaint.html" class="btn">Submit a New Complaint</a>

        <h2>Your Complaints</h2>
        <p id="emptyState" class="empty-state" hidden>You haven't submitted any complaints yet.</p>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Message</th>
                    <th>Status</th>
                    <th>Date Submitted</th>
                </tr>
            </thead>
            <tbody id="complaintsBody"></tbody>
        </table>
    </div>

    <footer style="background-color: #333; color: white; padding: 20px; text-align: center;">
        <p>&copy; 2026 Ministry of Local Government</p>
    </footer>
</body>
</html>
